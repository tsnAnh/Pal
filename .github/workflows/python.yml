name: Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.paths.outputs.python }}
      tooling_tests: ${{ steps.paths.outputs.tooling_tests }}
      ios_guards: ${{ steps.paths.outputs.ios_guards }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Select jobs from the changed paths (scripts/ci/ci_paths.py)
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/ci_paths.py --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  ios-guards:
    name: ios-guards
    needs: changes
    if: needs.changes.outputs.ios_guards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Guards that read apps/ios (python scripts/check --only)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_args=()
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            base_args=(--base "$BASE")
          fi
          python3 scripts/check --only "$(python3 scripts/ci/ci_paths.py --checks ios-guards)" "${base_args[@]}"

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
          prune-python-cache: true

      - name: Install pinned ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: Lint and static checks (python scripts/check)
        run: python scripts/check

      # Subset, not the full suite: the full suite is sized for three 32-vCPU runners and does not
      # finish on a hosted 4-vCPU one. tests/ci and tests/scripts cover the repo's own guards and
      # tooling (about 8 min on 4 vCPU). Excluded: two tests red on main today, test_docs_drift
      # (undocumented config keys, /reach) and test_prompt_surface (stale snapshot), and
      # test_code_health_identity, which exceeded its 300 s file timeout on a 4-vCPU sandbox.
      - name: Tests (tests/ci, tests/scripts)
        if: needs.changes.outputs.tooling_tests == 'true'
        run: >-
          scripts/run_tests.sh tests/ci tests/scripts --
          --deselect=tests/ci/test_docs_drift.py::test_no_new_undocumented_config_keys_or_slash_commands
          --deselect=tests/ci/test_prompt_surface.py::test_committed_prompt_surface_is_current
          --ignore=tests/scripts/test_code_health_identity.py
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      # The gateway files that drive the devices/bots harness (tests/gateway/devices_harness.py,
      # bots_harness.py), where a stale initialize_session_authority call went unseen. Two
      # test_canonical_bridge tests are red on main (library.list, account-owned connector calls).
      - name: Tests (gateway device and bot harness)
        if: needs.changes.outputs.tooling_tests == 'true'
        run: >-
          scripts/run_tests.sh
          tests/gateway/test_push_notifications.py
          tests/gateway/test_push_silence.py
          tests/gateway/test_diag_trace_ledger.py
          tests/gateway/test_chat_native_owner.py
          tests/gateway/test_device_kind_stays_mac.py
          tests/gateway/test_kanban_boards_unopenable.py
          tests/gateway/test_canonical_bridge.py
          tests/hermes_cli/test_native_device_grants.py --
          --deselect=tests/gateway/test_canonical_bridge.py::test_a_read_grant_gets_the_sidecar_answer_for_every_read_verb[library.list-params1-keys1]
          --deselect=tests/gateway/test_canonical_bridge.py::test_account_owned_connector_calls_are_served_not_unknown
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  ci:
    name: ci
    needs: [changes, ios-guards, python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a selected job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
