name: faker-kit-checks
on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'scripts/link-skills.sh'
      - '.github/**'
      - 'scripts/check'
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/link-skills.sh --check .
