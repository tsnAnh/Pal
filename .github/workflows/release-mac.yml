name: Release Pal for Mac

on:
  push:
    tags: ['mac-v*']

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: release
    runs-on: xcode-27
    environment: mac-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#mac-v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "tag $GITHUB_REF_NAME is not mac-vX.Y.Z" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Select the newest Xcode
        run: |
          shopt -s nullglob
          installed=(/Applications/Xcode_*.app)
          [[ ${#installed[@]} -gt 0 ]] || { echo "no /Applications/Xcode_*.app installed" >&2; exit 1; }
          newest="$(printf '%s\n' "${installed[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificates
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/release-mac.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          import_p12() {
            local p12_base64="$1" p12_password="$2" file="$RUNNER_TEMP/signing-$RANDOM.p12"
            printf '%s' "$p12_base64" | base64 --decode > "$file"
            security import "$file" -k "$keychain" -P "$p12_password" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$file"
          }

          import_p12 "$MAC_DEVELOPER_ID_P12" "$MAC_DEVELOPER_ID_P12_PASSWORD"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          keychains=("$keychain")
          while IFS= read -r line; do
            keychains+=("$(printf '%s' "$line" | tr -d ' "')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write keys and provisioning profiles
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          MAC_APP_PROFILE: ${{ secrets.MAC_APP_PROFILE }}
          MAC_NSE_PROFILE: ${{ secrets.MAC_NSE_PROFILE }}
        run: |
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed-key"
          printf '%s' "$MAC_APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/mac-app.provisionprofile"
          printf '%s' "$MAC_NSE_PROFILE" | base64 --decode > "$RUNNER_TEMP/mac-nse.provisionprofile"
          {
            echo "ASC_KEY_FILE=$RUNNER_TEMP/asc-api-key.p8"
            echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle-ed-key"
            echo "MAC_APP_PROFILE_FILE=$RUNNER_TEMP/mac-app.provisionprofile"
            echo "MAC_NSE_PROFILE_FILE=$RUNNER_TEMP/mac-nse.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Write release notes from the tag message
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [[ "$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(objecttype)')" == tag ]]; then
            umask 077
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > "$RUNNER_TEMP/release-notes.md"
            echo "NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          fi

      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          args=(
            --version "$VERSION"
            --tag "$GITHUB_REF_NAME"
            --asc-key-file "$ASC_KEY_FILE"
            --asc-key-id "$ASC_API_KEY_ID"
            --asc-issuer-id "$ASC_API_ISSUER_ID"
            --ed-key-file "$SPARKLE_KEY_FILE"
            --profile "$MAC_APP_PROFILE_FILE"
            --profile "$MAC_NSE_PROFILE_FILE"
          )
          if [[ -n "${NOTES_FILE:-}" ]]; then
            args+=(--notes "$NOTES_FILE")
          fi
          apps/ios/Scripts/release-mac "${args[@]}"

      - name: Show release logs
        if: failure()
        run: |
          for dir in apps/ios/build/release-mac/*/; do
            for name in archive.log export.log appcast.log notarize-log.json; do
              if [[ -f "$dir$name" ]]; then
                echo "::group::$dir$name"
                tail -n 80 "$dir$name"
                echo "::endgroup::"
              fi
            done
          done

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/signing-*.p12 "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/sparkle-ed-key" "$RUNNER_TEMP/mac-app.provisionprofile" "$RUNNER_TEMP/mac-nse.provisionprofile" "$RUNNER_TEMP/release-notes.md"
