manifest_version: 1

name: upwork
description: Search Upwork jobs and freelancers, read proposals, contracts and messages, and send proposals or messages only after you approve each one.
source: https://www.upwork.com/ai/mcp

transport:
  type: http
  url: https://mcp.upwork.com/mcp

auth:
  type: oauth
  signin_on: owner_app

action_policy:
  read_tools:
    - upwork__find_freelancers
    - upwork__find_jobs
    - upwork__find_saved_jobs
    - upwork__get_account
    - upwork__get_agency
    - upwork__get_freelancer_dashboard
    - upwork__get_freelancer_financials
    - upwork__get_freelancer_work
    - upwork__get_messages
    - upwork__get_preview
    - upwork__get_profile
    - upwork__get_tool_help
    - upwork__get_upload_status
    - upwork__list_accounts
    - upwork__list_contracts
    - upwork__list_freelancer_proposals
    - upwork__list_milestones
    - upwork__list_offers
    - upwork__search_help_center
  refused_tools:
    - fund_escrow
    - fund_milestone
    - accept_offer
    - pay_milestone
    - release_milestone
    - release_escrow
    - release_payment
    - make_payment
    - send_payment
    - pay_invoice
  refused_message: This step moves money, so the assistant never does it. Do it yourself on upwork.com.

suggest:
  keywords:
    - upwork
  hosts:
    - upwork.com

post_install: |
  Sign in to Upwork from any Pal app (Mac, iPhone or iPad). Upwork only approves a sign-in redirect
  to the device itself, so the sign-in is not started from the Hermes host. The Pal app finishes it
  and hands the tokens to the gateway, which keeps and refreshes them.
