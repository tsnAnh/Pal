  notes: Runs on your Pal with your own Google sign-in client. Read only, so Pal reads campaign stats and never changes
    a campaign. Google ends the sign-in after 7 days while your Google app is in Testing mode.
  stdio:
    command: uv
    args: [tool, run, "google-ads-mcp==0.0.6"]
    env: {}
- id: google-workspace
  name: Google Workspace
  description: "Work with your Gmail, Calendar, Drive, Docs and Sheets."
  icon: plugin_glyph
  category: Docs and files
  method: oauth_client
  oauth:
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.readonly
  - https://www.googleapis.com/auth/gmail.send
  - https://www.googleapis.com/auth/gmail.modify
  - https://www.googleapis.com/auth/calendar
  - https://www.googleapis.com/auth/drive
  - https://www.googleapis.com/auth/contacts.readonly
  - https://www.googleapis.com/auth/spreadsheets
  - https://www.googleapis.com/auth/documents
  setup:
    steps:
    - id: address
      kind: public_url
      title: Your Pal's web address
      body: Google sends you back to your Pal after you sign in, so your Pal needs a public https address. Use the address
        you already reach your Pal at, such as your Tailscale address.
    - id: console
      kind: open_page
      title: Create a Google sign-in client
      body: In Google Cloud, create an OAuth client ID of type Web application. Paste the redirect URI below into
        its Authorized redirect URIs.
      links:
      - {label: Open Google Cloud credentials, url: "https://console.cloud.google.com/apis/credentials"}
      copies:
      - {label: Redirect URI, value: "{redirect_url}"}
      fallback:
        label: Google rejected the address
        body: Google only accepts redirect addresses that start with https and use a domain name, not an IP address. Use
          your own domain for your Pal's address, or create a Desktop app client in Google Cloud, which needs no public
          address.
        links:
        - {label: Google's Desktop app guide, url: "https://developers.google.com/identity/protocols/oauth2/native-app"}
        - {label: Open Google Cloud credentials, url: "https://console.cloud.google.com/apis/credentials"}
    - id: apis
      kind: open_page
      title: Turn on the Google services
      body: Turn on each service Pal should use. Then add yourself as a test user on the OAuth consent screen. While the
        app is in Testing mode, Google ends the sign-in after 7 days.
      links:
      - {label: Gmail, url: "https://console.cloud.google.com/apis/library/gmail.googleapis.com"}
      - {label: Calendar, url: "https://console.cloud.google.com/apis/library/calendar-json.googleapis.com"}
      - {label: Drive, url: "https://console.cloud.google.com/apis/library/drive.googleapis.com"}
      - {label: People, url: "https://console.cloud.google.com/apis/library/people.googleapis.com"}
      - {label: Sheets, url: "https://console.cloud.google.com/apis/library/sheets.googleapis.com"}
      - {label: Docs, url: "https://console.cloud.google.com/apis/library/docs.googleapis.com"}
      - {label: Consent screen, url: "https://console.cloud.google.com/apis/credentials/consent"}
    - id: client
      kind: paste
      title: Paste your client
      body: Copy the client ID and client secret Google shows and paste them here. Pal checks them with Google before saving.
      fields:
      - {id: client_id, label: Client ID, secret: false, suffix: .apps.googleusercontent.com}
      - {id: client_secret, label: Client secret, secret: true}
      check: google_client
  notes: Google lets only the test users you added sign in until it verifies your app, and their sign-in lasts
    7 days while the app is in Testing. Publish and verify the app in Google Cloud Console to remove both limits.
  verified: true
  source: https://developers.google.com/identity/protocols/oauth2/web-server
