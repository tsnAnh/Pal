      body: In Slack, choose From a manifest, pick your workspace, paste the manifest below, create the app and install
        it to your workspace.
      links:
      - {label: Open Slack apps, url: "https://api.slack.com/apps?new_app=1"}
      copies:
      - label: App manifest
        value: |-
          {
            "display_information": {
              "name": "Pal"
            },
            "oauth_config": {
              "redirect_urls": [
                "http://localhost:27890/callback"
              ],
              "scopes": {
                "user": [
                  "search:read.public",
                  "search:read.private",
                  "search:read.mpim",
                  "search:read.im",
                  "search:read.files",
                  "search:read.users",
                  "files:read",
                  "files:write",
                  "emoji:read",
                  "chat:write",
                  "channels:history",
                  "groups:history",
                  "mpim:history",
                  "im:history",
                  "reactions:write",
                  "reactions:read",
                  "channels:write",
                  "groups:write",
                  "im:write",
                  "mpim:write",
                  "channels:read",
                  "groups:read",
                  "mpim:read",
                  "im:read",
                  "canvases:read",
                  "canvases:write",
                  "users:read",
                  "users:read.email",
                  "lists:read",
                  "lists:write"
                ]
              }
            }
          }
    - id: client
      kind: paste
      title: Paste your app credentials
      body: Open Basic Information in your Slack app and copy the client ID and client secret. Pal checks them with Slack
        before saving.
      fields:
      - {id: client_id, label: Client ID, secret: false}
      - {id: client_secret, label: Client secret, secret: true}
      check: slack_client
