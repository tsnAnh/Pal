- id: google-ads
  name: Google Ads
  description: "Read campaign, ad group and keyword performance from your Google Ads account."
  icon: plugin_glyph
  category: Monitoring and analytics
  method: oauth_client
  oauth:
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
