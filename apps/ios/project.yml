name: HermesBots
options:
  bundleIdPrefix: dev.tsnanh.hermes
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: G94PJ7VQBJ
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HermesKit:
    path: Packages/HermesKit
  HermesDesign:
    path: Packages/HermesDesign
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  HermesBots:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pal
        CFBundleName: Pal
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Pal listens while you dictate a message or talk to a bot in voice mode.
        NSSpeechRecognitionUsageDescription: Pal turns your speech into text on this device for dictation and voice mode.
        NSCameraUsageDescription: Pal can take a photo to send to a bot.
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Pal reads your calendar and adds events when you ask your bot to.
        NSRemindersFullAccessUsageDescription: Pal reads and adds your reminders when you ask your bot to.
        NSContactsUsageDescription: Pal looks up people in your contacts when you ask your bot to.
        NSLocationWhenInUseUsageDescription: Pal uses your location to tell your bot where you are and to find places near you.
        NSHomeKitUsageDescription: Pal controls your lights, locks and other home accessories when you ask your bot to.
        NSAlarmKitUsageDescription: Pal sets alarms and timers when you ask your bot to.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot
        PRODUCT_NAME: Pal
        PRODUCT_MODULE_NAME: HermesBots
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: App/HermesBots.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/HermesBots-macOS.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: HermesKit
        product: HermesProtocol
      - package: HermesKit
        product: HermesDiagnostics
      - package: HermesKit
        product: HermesREST
      - package: HermesKit
        product: HermesAuth
      - package: HermesKit
        product: HermesTransport
      - package: HermesKit
        product: HermesClient
      - package: HermesKit
        product: HermesChat
      - package: HermesKit
        product: HermesRoster
      - package: HermesKit
        product: HermesBotProfile
      - package: HermesKit
        product: HermesRFB
      - package: HermesKit
        product: HermesDevice
      - package: HermesKit
        product: HermesConnect
      - package: HermesKit
        product: HermesSettings
      - package: HermesDesign
        product: HermesDesign
      - package: SwiftMath
        product: SwiftMath
  HermesBotsUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
        includes:
          - E2ESupport.swift
          - BotProfileSupport.swift
          - ComputerSupport.swift
          - SignInFlowTests.swift
          - BotChatE2ETests.swift
          - ComputerE2ETests.swift
          - MacShellE2ETests.swift
          - MacModalsE2ETests.swift
          - MacChatDetailsE2ETests.swift
          - MacPinnedHeroE2ETests.swift
          - MacBotManagementE2ETests.swift
      - path: UITests
        excludes:
          - E2ESupport.swift
          - BotProfileSupport.swift
          - ComputerSupport.swift
          - SignInFlowTests.swift
          - BotChatE2ETests.swift
          - ComputerE2ETests.swift
          - MacShellE2ETests.swift
          - MacModalsE2ETests.swift
          - MacChatDetailsE2ETests.swift
          - MacPinnedHeroE2ETests.swift
          - MacBotManagementE2ETests.swift
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot.uitests
        TEST_TARGET_NAME: HermesBots
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HermesBots
      - package: HermesDesign
        product: HermesDesign
      - sdk: AppIntentsTesting.framework
        destinationFilters: [iOS]
schemes:
  HermesBots:
    build:
      targets:
        HermesBots: all
    test:
      targets:
        - HermesBotsUITests
