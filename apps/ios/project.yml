name: HermesBots
options:
  bundleIdPrefix: dev.tsnanh.hermes
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: G94PJ7VQBJ
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PalKit:
    path: Packages/PalKit
  PalDesign:
    path: Packages/PalDesign
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  HermesBots:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pal
        CFBundleName: Pal
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.tsnanh.hermes.bot
            CFBundleURLSchemes:
              - dev.tsnanh.hermes.bot
        NSPhotoLibraryAddUsageDescription: Pal saves your bot's picture to Photos so you can add it in Slack.
        NSMicrophoneUsageDescription: Pal listens while you dictate a message or talk to a bot in voice mode.
        NSSpeechRecognitionUsageDescription: Pal turns your speech into text on this device for dictation and voice mode.
        NSCameraUsageDescription: Pal can take a photo to send to a bot.
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Pal reads your calendar and adds events when you ask your bot to.
        NSRemindersFullAccessUsageDescription: Pal reads and adds your reminders when you ask your bot to.
        NSContactsUsageDescription: Pal looks up people in your contacts when you ask your bot to.
        NSLocationWhenInUseUsageDescription: Pal uses your location to tell your bot where you are and to find places near you.
        NSHomeKitUsageDescription: Pal controls your lights, locks and other home accessories when you ask your bot to.
        NSAlarmKitUsageDescription: Pal sets alarms and timers when you ask your bot to.
        NSAppleEventsUsageDescription: Pal sends a message through the Messages app when you approve a bot's request to.
        NSUserActivityTypes:
          - INSendMessageIntent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot
        PRODUCT_NAME: Pal
        PRODUCT_MODULE_NAME: HermesBots
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: App/HermesBots.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/HermesBots-macOS.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: PalKit
        product: PalProtocol
      - package: PalKit
        product: PalDiagnostics
      - package: PalKit
        product: PalREST
      - package: PalKit
        product: PalAuth
      - package: PalKit
        product: PalTransport
      - package: PalKit
        product: PalClient
      - package: PalKit
        product: PalChat
      - package: PalKit
        product: PalRoster
      - package: PalKit
        product: PalBotProfile
      - package: PalKit
        product: PalRFB
      - package: PalKit
        product: PalDevice
      - package: PalKit
        product: PalConnect
      - package: PalKit
        product: PalSettings
      - package: PalKit
        product: PalKanban
      - package: PalKit
        product: PalPush
      - package: PalDesign
        product: PalDesign
      - package: SwiftMath
        product: SwiftMath
      - target: NotificationService
  NotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Pal Notifications
        CFBundleName: Pal Notifications
        NSExtension:
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot.notification-service
        PRODUCT_NAME: PalNotificationService
        PRODUCT_MODULE_NAME: NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NotificationService/NotificationService-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: PalKit
        product: PalPush
  HermesBotsUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
        includes:
          - E2ESupport.swift
          - BotProfileSupport.swift
          - ComputerSupport.swift
          - SignInFlowTests.swift
          - BotChatE2ETests.swift
          - ComputerE2ETests.swift
          - MacShellE2ETests.swift
          - MacModalsE2ETests.swift
          - MacChatDetailsE2ETests.swift
          - MacPinnedHeroE2ETests.swift
          - MacBotManagementE2ETests.swift
          - MacRoomSheetE2ETests.swift
      - path: UITests
        excludes:
          - E2ESupport.swift
          - BotProfileSupport.swift
          - ComputerSupport.swift
          - SignInFlowTests.swift
          - BotChatE2ETests.swift
          - ComputerE2ETests.swift
          - MacShellE2ETests.swift
          - MacModalsE2ETests.swift
          - MacChatDetailsE2ETests.swift
          - MacPinnedHeroE2ETests.swift
          - MacBotManagementE2ETests.swift
          - MacRoomSheetE2ETests.swift
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot.uitests
        TEST_TARGET_NAME: HermesBots
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HermesBots
      - package: PalDesign
        product: PalDesign
      - sdk: AppIntentsTesting.framework
        destinationFilters: [iOS]
  HermesBotsTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.hermes.bot.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pal.app/Pal
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Pal.app/Contents/MacOS/Pal
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: HermesBots
      - package: PalKit
        product: PalProtocol
      - package: PalKit
        product: PalDiagnostics
      - package: PalKit
        product: PalREST
      - package: PalKit
        product: PalAuth
      - package: PalKit
        product: PalClient
      - package: PalKit
        product: PalRoster
      - package: PalKit
        product: PalConnect
      - package: PalKit
        product: PalChat
      - package: PalKit
        product: PalBotProfile
      - package: PalDesign
        product: PalDesign
schemes:
  HermesBots:
    build:
      targets:
        HermesBots: all
    test:
      targets:
        - HermesBotsTests
        - HermesBotsUITests
