name: Pal
options:
  bundleIdPrefix: dev.tsnanh.pal
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: G94PJ7VQBJ
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PAL_UPDATE_FEED: ""
    PAL_UPDATE_PUBLIC_KEY: 0VZX/1gQCTn6WEu4cTcE9pXnHiUGeq+BLaEni7/Ovsc=
    PAL_MAC_APP_PROFILE: ""
    PAL_MAC_NSE_PROFILE: ""
packages:
  PalKit:
    path: Packages/PalKit
  PalDesign:
    path: Packages/PalDesign
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Pal:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - path: ../../scripts/install.sh
        buildPhase: resources
        destinationFilters: [macOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PAL_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: $(PAL_DISPLAY_NAME)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PAL_URL_SCHEME)
            CFBundleURLSchemes:
              - $(PAL_URL_SCHEME)
        PalURLScheme: $(PAL_URL_SCHEME)
        NSPhotoLibraryAddUsageDescription: Pal saves your bot's picture to Photos so you can add it in Slack.
        NSMicrophoneUsageDescription: Pal listens while you dictate a message or talk to a bot in voice mode.
        NSSpeechRecognitionUsageDescription: Pal turns your speech into text on this device for dictation and voice mode.
        NSCameraUsageDescription: Pal can take a photo to send to a bot.
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Pal reads your calendar and adds events when you ask your bot to.
        NSRemindersFullAccessUsageDescription: Pal reads and adds your reminders when you ask your bot to.
        NSContactsUsageDescription: Pal looks up people in your contacts when you ask your bot to.
        NSLocationWhenInUseUsageDescription: Pal uses your location to tell your bot where you are and to find places near you.
        NSHomeKitUsageDescription: Pal controls your lights, locks and other home accessories when you ask your bot to.
        NSAlarmKitUsageDescription: Pal sets alarms and timers when you ask your bot to.
        NSAppleEventsUsageDescription: Pal sends a message through the Messages app when you approve a bot's request to.
        NSUserActivityTypes:
          - INSendMessageIntent
        SUFeedURL: $(PAL_UPDATE_FEED)
        SUPublicEDKey: $(PAL_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 14400
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.pal
        PAL_DISPLAY_NAME: Pal
        PAL_URL_SCHEME: dev.tsnanh.hermes.bot
        PRODUCT_NAME: Pal
        PRODUCT_MODULE_NAME: Pal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: App/Pal.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Pal-macOS.entitlements
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(PAL_MAC_APP_PROFILE)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]: dev.tsnanh.pal.development
          PAL_DISPLAY_NAME[sdk=macosx*]: Pal Dev
          PAL_URL_SCHEME[sdk=macosx*]: dev.tsnanh.hermes.bot.dev
          ENABLE_HARDENED_RUNTIME[sdk=macosx*]: NO
    dependencies:
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]
      - package: PalKit
        product: PalProtocol
      - package: PalKit
        product: PalDiagnostics
      - package: PalKit
        product: PalREST
      - package: PalKit
        product: PalAuth
      - package: PalKit
        product: PalTransport
      - package: PalKit
        product: PalClient
      - package: PalKit
        product: PalChat
      - package: PalKit
        product: PalRoster
      - package: PalKit
        product: PalBotProfile
      - package: PalKit
        product: PalRFB
      - package: PalKit
        product: PalDevice
      - package: PalKit
        product: PalConnect
      - package: PalKit
        product: PalSettings
      - package: PalKit
        product: PalKanban
      - package: PalKit
        product: PalPush
      - package: PalKit
        product: PalLocalEngine
        destinationFilters: [macOS]
      - package: PalDesign
        product: PalDesign
      - package: SwiftMath
        product: SwiftMath
      - target: NotificationService
  NotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Pal Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Pal Notifications
        NSExtension:
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.pal.notification-service
        PRODUCT_NAME: PalNotificationService
        PRODUCT_MODULE_NAME: NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NotificationService/NotificationService-macOS.entitlements
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(PAL_MAC_NSE_PROFILE)
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]: dev.tsnanh.pal.development.notification-service
          ENABLE_HARDENED_RUNTIME[sdk=macosx*]: NO
    dependencies:
      - package: PalKit
        product: PalPush
  PalUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
        includes:
          - E2ESupport.swift
          - BotProfileSupport.swift
          - ComputerSupport.swift
          - SignInFlowTests.swift
          - BotChatE2ETests.swift
          - ComputerE2ETests.swift
          - MacShellE2ETests.swift
          - MacModalsE2ETests.swift
          - MacModalVisibleE2ETests.swift
          - MacChatDetailsE2ETests.swift
          - MacPinnedHeroE2ETests.swift
          - MacBotManagementE2ETests.swift
          - MacRoomSheetE2ETests.swift
          - ConnectAppsE2ETests.swift
          - ConnectorDetailsE2ETests.swift
          - SlackMemberShots.swift
          - MacPerfTourSupport.swift
          - MacPerfTourTests.swift
          - MacPerfTourSurfaces.swift
          - MacPerfTourSettings.swift
      - path: UITests
        excludes:
          - E2ESupport.swift
          - BotProfileSupport.swift
          - ComputerSupport.swift
          - SignInFlowTests.swift
          - BotChatE2ETests.swift
          - ComputerE2ETests.swift
          - MacShellE2ETests.swift
          - MacModalsE2ETests.swift
          - MacModalVisibleE2ETests.swift
          - MacChatDetailsE2ETests.swift
          - MacPinnedHeroE2ETests.swift
          - MacBotManagementE2ETests.swift
          - MacRoomSheetE2ETests.swift
          - ConnectAppsE2ETests.swift
          - ConnectorDetailsE2ETests.swift
          - SlackMemberShots.swift
          - MacPerfTourSupport.swift
          - MacPerfTourTests.swift
          - MacPerfTourSurfaces.swift
          - MacPerfTourSettings.swift
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.pal.uitests
        TEST_TARGET_NAME: Pal
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pal
      - package: PalDesign
        product: PalDesign
      - sdk: AppIntentsTesting.framework
        destinationFilters: [iOS]
  PalTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tsnanh.pal.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pal.app/Pal
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Pal.app/Contents/MacOS/Pal
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Pal
      - package: PalKit
        product: PalLocalEngine
      - package: PalKit
        product: PalProtocol
      - package: PalKit
        product: PalDiagnostics
      - package: PalKit
        product: PalREST
      - package: PalKit
        product: PalAuth
      - package: PalKit
        product: PalClient
      - package: PalKit
        product: PalRoster
      - package: PalKit
        product: PalConnect
      - package: PalKit
        product: PalChat
      - package: PalKit
        product: PalBotProfile
      - package: PalDesign
        product: PalDesign
schemes:
  Pal:
    build:
      targets:
        Pal: all
    test:
      targets:
        - PalTests
        - PalUITests
